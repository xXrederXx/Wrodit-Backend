name: Backend
permissions:
  contents: write
  pull-requests: write
on:
  pull_request:
  push:
    branches:
      - main
      - production
jobs:
  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew --build-cache --parallel spotlessCheck
  test:
    needs: format
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew --build-cache --parallel test
      - run: ./gradlew --build-cache --parallel jacocoTestReport
      - name: Generate JaCoCo badges
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2.12.1
        with:
          jacoco-csv-file: build/reports/jacoco/test/jacocoTestReport.csv
          generate-branches-badge: true
      - name: Log coverage percentages
        run: |
          echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"
      - name: Create JaCoCo badge pull request
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ github.ref_name }}
          branch: chore/update-jacoco-badges-${{ github.ref_name }}
          delete-branch: true
          add-paths: .github/badges/*.svg
          commit-message: chore: update JaCoCo badges
          title: chore: update JaCoCo badges (${{ github.ref_name }})
          body: |
            Automated JaCoCo coverage badge update for `${{ github.ref_name }}`.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-build
          path: build/
      - uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: build/test-results/test/**/TEST-*.xml
  deploy-staging:
    if: false # github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: |
          curl -X GET "${{ secrets.COOLIFY_STAGING_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOK }}"
  deploy-production:
    if: false # github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: |
          curl -X GET "${{ secrets.COOLIFY_PRODUCTION_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOK }}"
