spring.config.import=optional:file:.env[.properties]

spring.application.name=wrodit
jwt.secret=${JWT_SECRET}

# === Datasource Configuration (using environment variables) ===
spring.datasource.url=jdbc:${DB_URL:mysql://localhost:3306/mydatabase?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / Hibernate Configuration ===
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# === Optional: Logging SQL (more readable) ===
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
